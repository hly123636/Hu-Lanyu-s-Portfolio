<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hu Lanyu's Portfolio</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
        body{background:#f6f6f8;color:#222;line-height:1.6;}
        header{text-align:center;padding:60px 20px;background:#fff;}
        h1{font-size:2.4rem;margin-bottom:12px;}
        header p{color:#666;font-size:1.1rem;max-width:600px;margin:0 auto;}
        .container{max-width:1200px;margin:0 auto;padding:40px 20px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(320px,1fr));gap:24px;}
        .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px #00000010;}
        .card img{width:100%;height:240px;object-fit:cover;display:block;}
        .card .info{padding:18px;}
        .card h3{margin-bottom:8px;}
        footer{text-align:center;padding:40px;color:#777;font-size:0.95rem;}
    </style>
</head>
<body>
<header>
    <h1>Hu Lanyu's Portfolio</h1>
    <p>C4D · PS 三维产品渲染 & 视觉设计</p>
</header>
<div class="container">
    <div class="grid">
        <div class="card">
            <img src="images/work1.png" alt="作品1">
            <div class="info">
                <h3>作品 01</h3>
                <p>产品三维渲染</p>
            </div>
        </div>
        <div class="card">
            <img src="images/work2.png" alt="作品2">
            <div class="info">
                <h3>作品 02</h3>
                <p>电商视觉设计</p>
            </div>
        </div>
        <div class="card">
            <img src="images/work3.png" alt="作品3">
            <div class="info">
                <h3>作品 03</h3>
                <p>C4D 产品动画静帧</p>
            </div>
        </div>
        <div class="card">
            <img src="images/work4.png" alt="作品4">
            <div class="info">
                <h3>作品 04</h3>
                <p>海报合成</p>
            </div>
        </div>
        <div class="card">
            <img src="images/work5.png" alt="作品5">
            <div class="info">
                <h3>作品 05</h3>
                <p>电竞产品渲染</p>
            </div>
        </div>
        <div class="card">
            <img src="images/work6.png" alt="作品6">
            <div class="info">
                <h3>作品 06</h3>
                <p>短视频视觉包装</p>
            </div>
        </div>
    </div>
</div>
<footer>
    © 2026 Hu Lanyu | Portfolio
</footer>
</body>
</html>
